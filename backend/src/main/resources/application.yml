spring:
  application:
    name: faceattend-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/faceattend}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: FaceAttendHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 250MB

server:
  port: ${PORT:8080}

# JWT
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# AI Service
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}
  api-key: ${AI_SERVICE_API_KEY:faceattend_internal_ai_secret_key_2026}
  connect-timeout-ms: 5000
  read-timeout-ms: 30000

# Biometric encryption
biometric:
  encryption-key: ${BIOMETRIC_ENCRYPTION_KEY:d7a98b472e11894dcb40f6f7bc2998a14b51820468f76023d8c11e2fbc0300fa}

# CORS
app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  face-similarity-threshold: ${FACE_SIMILARITY_THRESHOLD:0.45}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.faceattend: DEBUG
    org.springframework.security: WARN
    org.flywaydb: INFO
